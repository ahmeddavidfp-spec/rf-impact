<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#e11d2a" />
<title>Hors ligne - RF Impact</title>
<style>
  :root{ --bg:#0b1220; --card:#16233a; --line:#243450; --text:#eaf1fb; --muted:#9fb0c3; --red:#e11d2a; --red2:#ff5e3a; }
  @media (prefers-color-scheme:light){ :root{ --bg:#f4f7fc; --card:#ffffff; --line:#dde6f2; --text:#0f1c2e; --muted:#5a6b85; } }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom));
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.55}
  .box{max-width:440px;width:100%;text-align:center;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:34px 26px;box-shadow:0 20px 50px -24px rgba(0,0,0,.5)}
  .logo{width:66px;height:66px;margin:0 auto 18px;display:block}
  h1{font-size:1.4rem;margin:0 0 .5rem}
  p{color:var(--muted);margin:0 0 1.4rem;font-size:1rem}
  .alt{color:var(--muted);font-size:.9rem;margin:.2rem 0 0}
  .alt b{color:var(--text);font-weight:600}
  button{font:inherit;font-weight:600;font-size:1rem;border:0;cursor:pointer;color:#fff;
    background:linear-gradient(120deg,var(--red),var(--red2));border-radius:999px;padding:.8rem 1.6rem;
    box-shadow:0 10px 26px -10px rgba(225,29,42,.6)}
  button:active{transform:translateY(1px)}
  .tel{display:block;margin-top:1.1rem;color:var(--red2);font-weight:600;text-decoration:none}
</style>
</head>
<body>
  <div class="box">
    <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d2a"/><stop offset="1" stop-color="#ff5e3a"/></linearGradient></defs>
      <rect width="512" height="512" rx="112" fill="#0f1826"/>
      <circle cx="256" cy="256" r="26" fill="url(#g)"/>
      <circle cx="256" cy="256" r="66" fill="none" stroke="url(#g)" stroke-width="10"/>
      <circle cx="256" cy="256" r="112" fill="none" stroke="url(#g)" stroke-width="8" opacity=".55"/>
      <text x="256" y="452" font-family="Segoe UI,sans-serif" font-size="72" font-weight="700" fill="#fff" text-anchor="middle">RF</text>
    </svg>
    <h1 id="t"></h1>
    <p id="d"></p>
    <button id="retry" type="button"></button>
    <a class="tel" href="tel:+32477478714">0477 47 87 14</a>
  </div>
  <script>
    (function(){
      var T = {
        fr: { t:"Vous êtes hors ligne", d:"Impossible de charger la page. Vérifiez votre connexion, puis réessayez.", b:"Réessayer" },
        nl: { t:"U bent offline", d:"De pagina kan niet worden geladen. Controleer uw verbinding en probeer opnieuw.", b:"Opnieuw proberen" },
        en: { t:"You are offline", d:"The page could not load. Check your connection, then try again.", b:"Try again" }
      };
      var lang = "fr";
      try { lang = (localStorage.getItem("rf-lang") || (navigator.language || "fr").slice(0,2)).toLowerCase(); } catch(e){}
      if (!T[lang]) lang = "fr";
      var s = T[lang];
      document.documentElement.lang = lang;
      document.getElementById("t").textContent = s.t;
      document.getElementById("d").textContent = s.d;
      document.getElementById("retry").textContent = s.b;
      document.getElementById("retry").addEventListener("click", function(){ location.reload(); });
    })();
  </script>
</body>
</html>
